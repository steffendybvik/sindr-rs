# cargo-deny: licences and advisories for everything sindr ships.
# PCBCraft ships under MIT OR Apache-2.0, so every dependency's licence has
# to be compatible with both.
#
#     cargo deny check

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained crates and yanked versions.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own path dependencies carry a version, so they aren't wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
