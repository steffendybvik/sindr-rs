name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
    branches: [main, "v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  wasm:
    # PCBCraft's web app builds sindr for wasm32-unknown-unknown, where
    # std::time, threads and the file system fail at run time, not build time.
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --lib --target wasm32-unknown-unknown
      - run: cargo build --workspace --lib --target wasm32-unknown-unknown --all-features
      - name: Pin the test runner to Cargo.lock's wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; split($0,a,"\""); print a[2]}' Cargo.lock)
          echo "WASM_BINDGEN=$version" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}
      - name: Solve in Node
        # No -q: cargo passes it on, and the runner rejects it.
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p sindr --target wasm32-unknown-unknown --test wasm
          cargo test -p sindr --all-features --target wasm32-unknown-unknown --test wasm

  deny:
    # Licences compatible with MIT OR Apache-2.0, no advisories (deny.toml).
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  semver:
    # Plain 0.x: a patch release must not break callers. Compares each
    # crate's public API with its last version on crates.io, and fails on a
    # break the version bump doesn't allow (pre-1.0, only a minor bump may).
    name: semver checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
          # sindr-core has no published version to compare with until 0.1.0
          # ships. Drop this line then.
          exclude: sindr-core

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  docsrs:
    # Builds the docs the way docs.rs does, so `doc(cfg)` feature badges and
    # the crate docs render as they will once published.
    name: rustdoc (docs.rs)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  llms:
    # llms-full.txt is generated from the sources; fail if it's stale.
    name: llms-full.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/gen_llms_full.py --check

  examples:
    # Runs every example binary so they can't rot.
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail
          for path in sindr/examples/*.rs; do
            name=$(basename "$path" .rs)
            # Needs ngspice, which the runners don't have.
            [ "$name" = vs_ngspice ] && continue
            arg=""
            [ "$name" = run_example ] && arg=voltage-divider
            echo "::group::$name"
            cargo run -q -p sindr --all-features --example "$name" -- $arg
            echo "::endgroup::"
          done

  coverage:
    # The per-file table lands in the job summary. Core files have a floor
    # (scripts/coverage_floor.py); the rest is reported only.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --summary-only | tee coverage.txt
      - run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage floor
        run: |
          set -o pipefail
          python3 scripts/coverage_floor.py coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    # Runs the transient and Newton benchmarks on the PR's base, then on the
    # PR, on the same runner, and fails if any case is over 25% slower.
    # Same-runner comparison keeps the noise to a few percent.
    name: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Base
        run: |
          set -euo pipefail
          git checkout -q ${{ github.event.pull_request.base.sha }}
          benches=""
          for b in transient newton analyses spice; do
            [ -f "sindr/benches/$b.rs" ] && benches="$benches --bench $b"
          done
          if [ -n "$benches" ]; then
            cargo bench -q -p sindr --features spice $benches -- --quick --save-baseline base
          fi
          git checkout -q ${{ github.event.pull_request.head.sha }}
      - name: PR
        run: cargo bench -q -p sindr --features spice --bench transient --bench newton --bench analyses --bench spice -- --quick --save-baseline head
      - name: Compare
        run: |
          set -o pipefail
          python3 scripts/bench_compare.py base head --threshold 25 | tee -a "$GITHUB_STEP_SUMMARY"

  version-bumped:
    # Fails if a PR to main leaves any crate version unchanged from main, or
    # sets a prerelease version.
    # Forces a Cargo.toml bump + matching CHANGELOG section before merge.
    # PRs into a release staging branch (v*) skip it: the branch is already bumped.
    name: version bumped
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions must differ from base branch
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          fail=0
          for manifest in sindr/Cargo.toml sindr-core/Cargo.toml sindr-devices/Cargo.toml; do
            pr_ver=$(grep -m1 '^version' "$manifest" | cut -d'"' -f2)
            # Plain 0.x until 1.0: no prereleases (SemVer's -alpha, -rc …).
            if [[ "$pr_ver" == *-* ]]; then
              echo "::error file=$manifest::version $pr_ver is a prerelease — release as a plain x.y.z"
              fail=1
            fi
            if ! git cat-file -e "$base:$manifest" 2>/dev/null; then
              echo "$manifest: new crate at $pr_ver"
              continue
            fi
            base_ver=$(git show "$base:$manifest" | grep -m1 '^version' | cut -d'"' -f2)
            if [ "$pr_ver" = "$base_ver" ]; then
              echo "::error file=$manifest::version $pr_ver matches $base — bump it before merging"
              fail=1
            else
              echo "$manifest: $base_ver → $pr_ver"
            fi
          done
          # The bumped version must also appear as a CHANGELOG section header.
          new_ver=$(grep -m1 '^version' sindr/Cargo.toml | cut -d'"' -f2)
          if ! grep -qE "^## \[$new_ver\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$new_ver]' section found — promote [Unreleased] before merging"
            fail=1
          fi
          exit $fail
