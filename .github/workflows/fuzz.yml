name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  parse:
    name: fuzz SPICE parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run for ten minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/parse
          cp seeds/parse/* corpus/parse/
          cargo +nightly fuzz run parse corpus/parse -- \
            -dict=spice.dict -max_total_time=600 -max_len=4096
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
