name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  parse:
    name: fuzz the SPICE and expression parsers and the import API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run for ten minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/parse
          cp seeds/parse/* corpus/parse/
          cargo +nightly fuzz run parse corpus/parse -- \
            -dict=spice.dict -max_total_time=600 -max_len=4096
      - name: Run the expression parser for five minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/expression
          cp seeds/expression/* corpus/expression/
          cargo +nightly fuzz run expression corpus/expression -- \
            -max_total_time=300 -max_len=1024
      - name: Run the import API and its solves for five minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/import
          cp seeds/import/* corpus/import/
          cargo +nightly fuzz run import corpus/import -- \
            -max_total_time=300 -max_len=512 -timeout=20
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
