[package]
name = "sindr-core"
version = "0.1.0-alpha.8"
edition = "2021"
rust-version = "1.89"
description = "Circuit and design data model for sindr: components, hierarchy, nets and part data, without the solver."
license = "MIT OR Apache-2.0"
repository = "https://github.com/steffendybvik/sindr-rs"
homepage = "https://github.com/steffendybvik/sindr-rs"
documentation = "https://docs.rs/sindr-core"
readme = "README.md"
keywords = ["electronics", "circuit", "netlist", "schematic", "eda"]
categories = ["science", "data-structures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sindr-devices = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "sindr-devices/serde"]

[dev-dependencies]
approx = "0.5"
serde_json = { workspace = true }
