[package]
name = "sindr-devices"
version = "0.2.0"
edition.workspace = true
rust-version = "1.89"
description = "Device physics for the sindr circuit simulator: diode family, LED, BJT, MOSFET, JFET, IGBT, varactor, thermistor, photoresistor, regulator, battery and saturating inductor models, with no solver."
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sindr-devices"
readme = "README.md"
keywords = ["electronics", "simulation", "spice", "circuit", "eda"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, optional = true }

[features]
default = ["serde"]

[dev-dependencies]
approx = "0.5"
