[package]
name = "sindr-devices"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
description = "Pure electronics device physics: diode, BJT, MOSFET companion models for MNA circuit simulation. Companion crate to sindr."
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sindr-devices"
readme = "README.md"
keywords = ["electronics", "simulation", "spice", "circuit", "eda"]
categories = ["science", "simulation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true, optional = true }

[features]
default = ["serde"]

[dev-dependencies]
approx = "0.5"
